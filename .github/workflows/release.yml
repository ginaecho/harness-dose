name: Release

# Push a tag like v0.1.0 to cut a GitHub Release. If this repository is enabled
# on Zenodo (https://zenodo.org/account/settings/github/), the release is
# archived automatically and a DOI is minted. See docs/zenodo.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test before releasing
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
